<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>错题积累平台 · 入口</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(135deg,#a6c8ff 0%,#c9b6f5 50%,#ffc8e0 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#3a3760}
  .card{background:rgba(255,255,255,.92);border-radius:24px;padding:34px 26px;width:100%;max-width:360px;
    box-shadow:0 12px 36px rgba(120,100,170,.28);text-align:center}
  h1{font-size:24px;letter-spacing:1px;margin-bottom:6px}
  .sub{font-size:13px;color:#7a739a;margin-bottom:26px}
  a.btn{display:block;text-decoration:none;margin:12px 0;padding:18px;border-radius:16px;font-size:17px;font-weight:700;
    color:#fff;transition:transform .12s}
  a.btn:active{transform:scale(.97)}
  .t{background:linear-gradient(135deg,#7aa8ff,#8a63d8)}
  .s{background:linear-gradient(135deg,#ff9ec4,#c08bf0)}
  .tip{margin-top:22px;font-size:12px;color:#8a83a8;line-height:1.7}
  .heart{font-size:30px;margin-bottom:10px}
</style>
</head>
<body>
  <div class="card">
    <div class="heart">💜</div>
    <h1>错题积累平台</h1>
    <div class="sub">一年级数学 · 教学小助手</div>
    <a class="btn t" href="teacher.html">👩‍🏫 教师端（我）</a>
    <div class="tip">教师端：录错题、记课堂小测、发周报、抽盲盒<br>家长查看孩子错题，请用老师发的「周报」链接</div>
  </div>
</body>
</html>
